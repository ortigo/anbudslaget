name: Uppdatera data

on:
  schedule:
    - cron: "17 4 * * *"   # varje morgon ca 06:17 svensk sommartid (05:17 vintertid)
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
    inputs:
      backfill_months:
        description: "Månader bakåt vid första körningen"
        default: "12"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Hämta från TED
        env:
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_months || '12' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -o pipefail
          mkdir -p data
          python scripts/fetch_ted.py 2>&1 | tee data/last-run.log

      - name: Hämta rekryteringssignaler (Platsbanken)
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -o pipefail
          python scripts/fetch_jobs.py 2>&1 | tee data/jobs-run.log

      - name: Spara felrapport
        if: failure()
        run: |
          git config user.name "anbudslaget-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last-run.log data/ted-supported-fields.txt 2>/dev/null; git add data/last-run.log
          git commit -m "Felrapport $(date -u +%Y-%m-%dT%H:%M)" && git pull --rebase origin main && git push

      - name: Spara ändringar
        run: |
          git config user.name "anbudslaget-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Data $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - name: Skapa ärende med bevakningsträffar
        if: hashFiles('digest.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Nya träffar och signaler $(date -u +%Y-%m-%d)" \
            --body-file digest.md \
            --assignee "${{ github.repository_owner }}"

      - name: Förbered webbplats
        run: |
          mkdir -p _site
          cp index.html app.js styles.css watches.json _site/
          cp -r data _site/ 2>/dev/null || mkdir -p _site/data
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
